recipe: default.v1
assistant_id: pizza_bot
language: de

pipeline:
  - name: SpacyNLP
    model: de_core_news_sm
  - name: SpacyTokenizer
#  - name: SpacyFeaturizer => keine vorberechneten Vektoren in de_core_news_sm, alternativ größeres Modell _md oder _lg
  - name: CountVectorsFeaturizer
  - name: CRFEntityExtractor  
  - name: RegexEntityExtractor
    use_regexes: true
    use_word_boundaries: true
  - name: EntitySynonymMapper 
  - name: LogisticRegressionClassifier
  - name: FallbackClassifier
    threshold: 0.4 
    ambiguity_threshold: 0.1

policies:
  - name: RulePolicy
  - name: MemoizationPolicy

